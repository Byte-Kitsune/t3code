name: Cancel pending fork preview

on:
  push:
    branches: [main]
    paths: [".github/workflows/cancel-fork-preview.yml"]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.repository == 'Byte-Kitsune/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the preview started before local-only builds were requested
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/Byte-Kitsune/t3code/actions/runs/37755621138/cancel
